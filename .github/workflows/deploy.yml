name: Deploy Hugo site to GitHub Pages

# 推送到 main 就自动构建并发布；也可以在仓库网页上手动触发
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # 必须落在主题声明的 0.162.0–0.165.0 区间内，否则主题的版本校验会让构建直接失败
  # （本机与 CI 必须用同一个版本；决策记录见本地文档《博客建设方案.md》3.5，未随仓库发布）
  HUGO_VERSION: 0.165.0

jobs:
  build:
    # 固定到 ubuntu-24.04，不用 ubuntu-latest：后者会在 2026-10-19 自动迁到 Ubuntu 26
    # （来源是 CI 运行注解，实测可用 API 读取）——把"什么时候换系统"的决定权留在自己手里。
    runs-on: ubuntu-24.04
    steps:
      - name: Install Hugo extended CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
          # 装完立刻自证：应为 v0.165.0+extended；这一步失败说明包名或版本不对
          hugo version

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 主题是 git submodule，不加这行 themes/blowfish 会是空目录、构建必失败
          submodules: recursive
          # 取完整提交历史，文章的「最后更新」时间才准确
          fetch-depth: 0

      - name: Verify theme is present
        run: |
          test -f themes/blowfish/theme.toml && echo "✅ 主题已就位"
          git -C themes/blowfish log -1 --format='主题 commit: %H %ad' --date=short

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          # 站点地址由 Pages 配置决定（方案 B），好处是换域名不用改代码。
          BASE="${{ steps.pages.outputs.base_url }}"
          # 强制 https：Pages 在未启用 "Enforce HTTPS" 时会给出 http:// 地址
          # （本项目域名走 Cloudflare 代理，GitHub 签不了证书，所以那个开关一直不可用），
          # 不处理的话 sitemap / RSS / og:url 会全是 http（2026-09-23 实测到）。
          BASE="${BASE/http:\/\//https:\/\/}"
          echo "构建用 baseURL = $BASE/"
          hugo --gc --minify --baseURL "$BASE/"

      # 构建期断言（纯本地、不依赖网络）：
      # 首页引用的样式表路径，必须以「当次 baseURL 的路径部分」开头。
      #   baseURL = https://blog.wxgg.eu.cc      → 期望 /css/…
      #   baseURL = https://user.github.io/blog  → 期望 /blog/css/…
      # 不一致说明"构建用的地址"和"站点实际挂载位置"对不上——就是历史上那次
      # "页面能打开但完全没样式"的成因。
      - name: Assert asset paths match base URL
        run: |
          set -uo pipefail
          BASE="${{ steps.pages.outputs.base_url }}"
          BASE="${BASE/http:\/\//https:\/\/}"
          EXPECT_PATH=$(echo "$BASE" | sed -E 's#^https?://[^/]+##')
          EXPECT_PATH="${EXPECT_PATH%/}"
          CSS_PATH=$(grep -oE 'href=[^ >]+\.css' public/index.html | head -1 | sed 's/^href=//' | tr -d '"')
          echo "baseURL = $BASE"
          echo "期望路径前缀 = ${EXPECT_PATH}/"
          echo "实际样式表   = ${CSS_PATH:-（没找到）}"
          case "$CSS_PATH" in
            "${EXPECT_PATH}/"*) echo "✅ 资源路径与 baseURL 一致" ;;
            *) echo "::error::资源路径与 baseURL 不一致：期望以 ${EXPECT_PATH}/ 开头，实际为 ${CSS_PATH:-空}"; exit 1 ;;
          esac

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
