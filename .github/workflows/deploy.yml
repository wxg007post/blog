name: Deploy Hugo site to GitHub Pages

# 推送到 main 就自动构建并发布；也可以在仓库网页上手动触发
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # 必须落在主题声明的 0.162.0–0.165.0 区间内，否则主题的版本校验会让构建直接失败
  # （本机与 CI 必须用同一个版本，见《博客建设方案.md》3.5）
  HUGO_VERSION: 0.165.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo extended CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
          # 装完立刻自证：应为 v0.165.0+extended；这一步失败说明包名或版本不对
          hugo version

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 主题是 git submodule，不加这行 themes/blowfish 会是空目录、构建必失败
          submodules: recursive
          # 取完整提交历史，文章的「最后更新」时间才准确
          fetch-depth: 0

      - name: Verify theme is present
        run: |
          test -f themes/blowfish/theme.toml && echo "✅ 主题已就位"
          git -C themes/blowfish log -1 --format='主题 commit: %H %ad' --date=short

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          # 站点地址由 Pages 配置决定（方案 B）：
          #   - 自定义域名生效时，configure-pages 给出域名；
          #   - 未配置自定义域名时给出 https://<用户名>.github.io/<仓库名>。
          # 好处：以后换域名只需改 Pages 设置，不用改代码。
          # 保险：接下来"部署后自检"会实际请求线上首页与样式表，地址不对就 fail。
          echo "Pages base URL = ${{ steps.pages.outputs.base_url }}"
          hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # 部署后自检（方案 B 的保险）：
      # 实际请求线上首页与它引用的样式表，任一不是 200 就把这次运行判为失败，
      # 避免"域名/地址不一致导致没样式"这种情况被静默发布出去。
      - name: Smoke test deployed site
        run: |
          set -uo pipefail
          BASE="${{ steps.deployment.outputs.page_url }}"
          echo "自检目标 = $BASE"
          code=$(curl -s -o index.html -w '%{http_code}' -L "$BASE")
          echo "首页 HTTP = $code"
          if [ "$code" != "200" ]; then
            echo "❌ 首页返回 $code，部署异常"
            exit 1
          fi
          CSS_PATH=$(grep -oE 'href=[^ >]+\.css' index.html | head -1 | sed 's/^href=//' | tr -d '"')
          if [ -z "$CSS_PATH" ]; then
            echo "❌ 首页里找不到样式表引用"
            exit 1
          fi
          echo "样式表引用 = $CSS_PATH"
          case "$CSS_PATH" in
            http*) CSS_URL="$CSS_PATH" ;;
            *) ORIGIN=$(echo "$BASE" | sed -E 's#(https?://[^/]+).*#\1#'); CSS_URL="$ORIGIN$CSS_PATH" ;;
          esac
          echo "样式表 URL = $CSS_URL"
          csscode=$(curl -s -o /dev/null -w '%{http_code}' -L "$CSS_URL")
          echo "样式表 HTTP = $csscode"
          if [ "$csscode" != "200" ]; then
            echo "❌ 样式表加载失败：站点实际地址与构建时用的地址不一致"
            echo "   （典型表现：页面能打开但没样式、图标巨大、头像不显示）"
            exit 1
          fi
          echo "✅ 自检通过：首页与样式表都正常"
