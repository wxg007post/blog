name: Deploy Hugo site to GitHub Pages

# 推送到 main 就自动构建并发布；也可以在仓库网页上手动触发
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # 必须落在主题声明的 0.162.0–0.165.0 区间内，否则主题的版本校验会让构建直接失败
  # （本机与 CI 必须用同一个版本，见《博客建设方案.md》3.5）
  HUGO_VERSION: 0.165.0

jobs:
  build:
    runs-on: ubuntu-latest
    # 把 Pages 给出的站点地址传给 deploy 作业，"部署后自检"要用
    outputs:
      site_url: ${{ steps.pages.outputs.base_url }}
    steps:
      - name: Install Hugo extended CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
          # 装完立刻自证：应为 v0.165.0+extended；这一步失败说明包名或版本不对
          hugo version

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 主题是 git submodule，不加这行 themes/blowfish 会是空目录、构建必失败
          submodules: recursive
          # 取完整提交历史，文章的「最后更新」时间才准确
          fetch-depth: 0

      - name: Verify theme is present
        run: |
          test -f themes/blowfish/theme.toml && echo "✅ 主题已就位"
          git -C themes/blowfish log -1 --format='主题 commit: %H %ad' --date=short

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          # 站点地址由 Pages 配置决定（方案 B），好处是换域名不用改代码。
          BASE="${{ steps.pages.outputs.base_url }}"
          # 强制 https：Pages 在未启用 "Enforce HTTPS" 时会给出 http:// 地址
          # （本项目域名走 Cloudflare 代理，GitHub 签不了证书，所以那个开关一直不可用），
          # 不处理的话 sitemap / RSS / og:url 会全是 http（2026-09-23 实测到）。
          BASE="${BASE/http:\/\//https:\/\/}"
          echo "构建用 baseURL = $BASE/"
          hugo --gc --minify --baseURL "$BASE/"

      # 构建期断言（纯本地、不依赖网络）：
      # 首页引用的样式表路径，必须以「当次 baseURL 的路径部分」开头。
      #   baseURL = https://blog.wxgg.eu.cc      → 期望 /css/…
      #   baseURL = https://user.github.io/blog  → 期望 /blog/css/…
      # 不一致说明"构建用的地址"和"站点实际挂载位置"对不上——就是历史上那次
      # "页面能打开但完全没样式"的成因。
      - name: Assert asset paths match base URL
        run: |
          set -uo pipefail
          BASE="${{ steps.pages.outputs.base_url }}"
          BASE="${BASE/http:\/\//https:\/\/}"
          EXPECT_PATH=$(echo "$BASE" | sed -E 's#^https?://[^/]+##')
          EXPECT_PATH="${EXPECT_PATH%/}"
          CSS_PATH=$(grep -oE 'href=[^ >]+\.css' public/index.html | head -1 | sed 's/^href=//' | tr -d '"')
          echo "baseURL = $BASE"
          echo "期望路径前缀 = ${EXPECT_PATH}/"
          echo "实际样式表   = ${CSS_PATH:-（没找到）}"
          case "$CSS_PATH" in
            "${EXPECT_PATH}/"*) echo "✅ 资源路径与 baseURL 一致" ;;
            *) echo "::error::资源路径与 baseURL 不一致：期望以 ${EXPECT_PATH}/ 开头，实际为 ${CSS_PATH:-空}"; exit 1 ;;
          esac

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # 部署后自检（方案 B 的保险）
      # 目的：抓"只有线上才暴露"的问题——最典型的是「构建用的地址」与「站点实际挂载位置」
      #       不一致：首页能打开(200)，但它引用的样式表 404 → 页面完全没样式。
      # 判定规则（刻意做成"只在真正该拦的时候拦"）：
      #   首页 200 + 解析到样式表 + 样式表 404/410        → 判红（真问题）
      #   首页 200 + 样式表 200                          → 判绿
      #   其余（403/503 挑战页、超时、连接失败、解析不到）  → 判绿 + ::warning::（环境无法验证）
      # ⚠️ 首行必须 set +e：GitHub 的 run: 默认以 bash -e 执行，任何命令返回非零都会
      #    让脚本半路退出，重试与诊断代码都不会执行（2026-09-23 因此连红三次）。
      - name: Smoke test deployed site
        run: |
          set +e
          SITE="${{ needs.build.outputs.site_url }}"
          SITE="${SITE/http:\/\//https:\/\/}"
          PAGE_URL="${{ steps.deployment.outputs.page_url }}"
          echo "配置站点地址 site_url = ${SITE:-（空）}"
          echo "本次部署地址 page_url = ${PAGE_URL:-（空）}"

          VERDICT="unknown"
          DETAIL=""
          TARGET=""
          ATTEMPTS=0
          for BASE in "$SITE" "$PAGE_URL"; do
            if [ -z "$BASE" ]; then continue; fi
            echo "===== 检查目标：$BASE ====="
            i=1
            while [ "$i" -le 3 ]; do
              ATTEMPTS=$((ATTEMPTS + 1))
              code=$(curl -s -o page.html -w '%{http_code}' -L --max-time 15 "$BASE/?smoke=$i")
              if [ -z "$code" ]; then code="000"; fi
              css=$(grep -oE 'href=[^ >]+\.css' page.html 2>/dev/null | head -1 | sed 's/^href=//' | tr -d '"')
              size=$(wc -c < page.html 2>/dev/null | tr -d ' ')
              echo "第 $i 次：首页 HTTP=$code ；页面 ${size:-0} 字节 ；样式表=${css:-（未解析到）}"
              if [ "$code" = "200" ] && [ -n "$css" ]; then
                case "$css" in
                  http*) cssurl="$css" ;;
                  *) origin=$(echo "$BASE" | sed -E 's#(https?://[^/]+).*#\1#'); cssurl="$origin$css" ;;
                esac
                csscode=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 15 "$cssurl")
                if [ -z "$csscode" ]; then csscode="000"; fi
                echo "       样式表 $cssurl -> HTTP=$csscode"
                if [ "$csscode" = "200" ]; then
                  VERDICT="ok"; TARGET="$BASE"
                  break 2
                fi
                if [ "$csscode" = "404" ] || [ "$csscode" = "410" ]; then
                  VERDICT="broken"; TARGET="$BASE"
                  DETAIL="首页 200，但样式表 $css 返回 $csscode（请求 URL：$cssurl）"
                  break 2
                fi
                VERDICT="unverifiable"; TARGET="$BASE"
                DETAIL="样式表返回 $csscode（不是 404，可能是 CDN 拦截或临时故障）"
              else
                VERDICT="unverifiable"; TARGET="$BASE"
                DETAIL="首页返回 $code，页面 ${size:-0} 字节"
              fi
              i=$((i + 1))
              sleep 12
            done
          done

          case "$VERDICT" in
            ok)
              echo "✅ 自检通过：首页与样式表都正常（目标 $TARGET）"
              exit 0
              ;;
            broken)
              echo "::error::部署后自检发现真实问题：$DETAIL ；目标 $TARGET"
              exit 1
              ;;
            unverifiable)
              echo "::warning::环境无法验证，本次不判失败：$DETAIL ；目标 $TARGET ；共尝试 $ATTEMPTS 次"
              exit 0
              ;;
            *)
              echo "::warning::自检未取得任何结果（site_url=${SITE:-空} page_url=${PAGE_URL:-空}），本次不判失败"
              exit 0
              ;;
          esac
