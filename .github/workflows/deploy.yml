name: Deploy Hugo site to GitHub Pages

# 推送到 main 就自动构建并发布；也可以在仓库网页上手动触发
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # 必须落在主题声明的 0.162.0–0.165.0 区间内，否则主题的版本校验会让构建直接失败
  # （本机与 CI 必须用同一个版本，见《博客建设方案.md》3.5）
  HUGO_VERSION: 0.165.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo extended CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
          # 装完立刻自证：应为 v0.165.0+extended；这一步失败说明包名或版本不对
          hugo version

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 主题是 git submodule，不加这行 themes/blowfish 会是空目录、构建必失败
          submodules: recursive
          # 取完整提交历史，文章的「最后更新」时间才准确
          fetch-depth: 0

      - name: Verify theme is present
        run: |
          test -f themes/blowfish/theme.toml && echo "✅ 主题已就位"
          git -C themes/blowfish log -1 --format='主题 commit: %H %ad' --date=short

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          # 站点地址由 Pages 配置决定（方案 B），好处是换域名不用改代码。
          BASE="${{ steps.pages.outputs.base_url }}"
          # 强制 https：Pages 在未启用 "Enforce HTTPS" 时会给出 http:// 地址
          # （本项目域名走 Cloudflare 代理，GitHub 签不了证书，所以那个开关一直不可用），
          # 不处理的话 sitemap / RSS / og:url 会全是 http（2026-09-23 实测到）。
          BASE="${BASE/http:\/\//https:\/\/}"
          echo "构建用 baseURL = $BASE/"
          hugo --gc --minify --baseURL "$BASE/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # 部署后自检（方案 B 的保险）：
      # 实际请求线上首页与它引用的样式表，任一不是 200 就把这次运行判为失败。
      # 必须带重试：部署完成后 CDN/Pages 需要几秒到几十秒才切到新内容，
      # 只查一次会抓到上一版 HTML 而误报失败（2026-09-23 首次上线时就这样红过一次）。
      - name: Smoke test deployed site
        run: |
          set -uo pipefail
          BASE="${{ steps.deployment.outputs.page_url }}"
          echo "自检目标 = $BASE"
          OK=0
          for i in $(seq 1 8); do
            echo "--- 第 $i 次检查 ---"
            code=$(curl -s -o index.html -w '%{http_code}' -L "$BASE")
            CSS_PATH=$(grep -oE 'href=[^ >]+\.css' index.html | head -1 | sed 's/^href=//' | tr -d '"')
            if [ "$code" = "200" ] && [ -n "$CSS_PATH" ]; then
              case "$CSS_PATH" in
                http*) CSS_URL="$CSS_PATH" ;;
                *) ORIGIN=$(echo "$BASE" | sed -E 's#(https?://[^/]+).*#\1#'); CSS_URL="$ORIGIN$CSS_PATH" ;;
              esac
              csscode=$(curl -s -o /dev/null -w '%{http_code}' -L "$CSS_URL")
              echo "首页 HTTP=$code ；样式表 $CSS_PATH -> HTTP=$csscode"
              if [ "$csscode" = "200" ]; then
                OK=1
                echo "✅ 自检通过：首页与样式表都正常"
                break
              fi
            else
              echo "首页 HTTP=$code ；样式表引用 = ${CSS_PATH:-（没找到）}"
            fi
            echo "内容可能尚未同步，等 15 秒后重试…"
            sleep 15
          done
          if [ "$OK" != "1" ]; then
            echo "❌ 连续 8 次自检未通过"
            echo "   常见原因：站点实际地址与构建时用的 baseURL 不一致（表现：页面能打开但没样式、图标巨大、头像不显示）"
            exit 1
          fi
