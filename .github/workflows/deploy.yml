name: Deploy Hugo site to GitHub Pages

# 推送到 main 就自动构建并发布；也可以在仓库网页上手动触发
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # 必须落在主题声明的 0.162.0–0.165.0 区间内，否则主题的版本校验会让构建直接失败
  # （本机与 CI 必须用同一个版本，见《博客建设方案.md》3.5）
  HUGO_VERSION: 0.165.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo extended CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
          # 装完立刻自证：应为 v0.165.0+extended；这一步失败说明包名或版本不对
          hugo version

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 主题是 git submodule，不加这行 themes/blowfish 会是空目录、构建必失败
          submodules: recursive
          # 取完整提交历史，文章的「最后更新」时间才准确
          fetch-depth: 0

      - name: Verify theme is present
        run: |
          test -f themes/blowfish/theme.toml && echo "✅ 主题已就位"
          git -C themes/blowfish log -1 --format='主题 commit: %H %ad' --date=short

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
