name: Deploy Hugo site to GitHub Pages

# 推送到 main 就自动构建并发布；也可以在仓库网页上手动触发
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # 必须落在主题声明的 0.162.0–0.165.0 区间内，否则主题的版本校验会让构建直接失败
  # （本机与 CI 必须用同一个版本，见《博客建设方案.md》3.5）
  HUGO_VERSION: 0.165.0

jobs:
  build:
    runs-on: ubuntu-latest
    # 把 Pages 给出的站点地址传给 deploy 作业，"部署后自检"要用
    outputs:
      site_url: ${{ steps.pages.outputs.base_url }}
    steps:
      - name: Install Hugo extended CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
          # 装完立刻自证：应为 v0.165.0+extended；这一步失败说明包名或版本不对
          hugo version

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 主题是 git submodule，不加这行 themes/blowfish 会是空目录、构建必失败
          submodules: recursive
          # 取完整提交历史，文章的「最后更新」时间才准确
          fetch-depth: 0

      - name: Verify theme is present
        run: |
          test -f themes/blowfish/theme.toml && echo "✅ 主题已就位"
          git -C themes/blowfish log -1 --format='主题 commit: %H %ad' --date=short

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          # 站点地址由 Pages 配置决定（方案 B），好处是换域名不用改代码。
          BASE="${{ steps.pages.outputs.base_url }}"
          # 强制 https：Pages 在未启用 "Enforce HTTPS" 时会给出 http:// 地址
          # （本项目域名走 Cloudflare 代理，GitHub 签不了证书，所以那个开关一直不可用），
          # 不处理的话 sitemap / RSS / og:url 会全是 http（2026-09-23 实测到）。
          BASE="${BASE/http:\/\//https:\/\/}"
          echo "构建用 baseURL = $BASE/"
          hugo --gc --minify --baseURL "$BASE/"

      # 构建期断言（纯本地、不依赖网络）：
      # 首页引用的样式表路径，必须以「当次 baseURL 的路径部分」开头。
      #   baseURL = https://blog.wxgg.eu.cc      → 期望 /css/…
      #   baseURL = https://user.github.io/blog  → 期望 /blog/css/…
      # 不一致说明"构建用的地址"和"站点实际挂载位置"对不上——就是历史上那次
      # "页面能打开但完全没样式"的成因。
      - name: Assert asset paths match base URL
        run: |
          set -uo pipefail
          BASE="${{ steps.pages.outputs.base_url }}"
          BASE="${BASE/http:\/\//https:\/\/}"
          EXPECT_PATH=$(echo "$BASE" | sed -E 's#^https?://[^/]+##')
          EXPECT_PATH="${EXPECT_PATH%/}"
          CSS_PATH=$(grep -oE 'href=[^ >]+\.css' public/index.html | head -1 | sed 's/^href=//' | tr -d '"')
          echo "baseURL = $BASE"
          echo "期望路径前缀 = ${EXPECT_PATH}/"
          echo "实际样式表   = ${CSS_PATH:-（没找到）}"
          case "$CSS_PATH" in
            "${EXPECT_PATH}/"*) echo "✅ 资源路径与 baseURL 一致" ;;
            *) echo "::error::资源路径与 baseURL 不一致：期望以 ${EXPECT_PATH}/ 开头，实际为 ${CSS_PATH:-空}"; exit 1 ;;
          esac

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # 部署后自检（方案 B 的保险）：
      # 实际请求线上首页与它引用的样式表，任一不是 200 就把这次运行判为失败。
      #   - 必须带重试：部署完成后 CDN/Pages 需要几秒到几十秒才切到新内容；
      #   - 必须可诊断：失败时用 ::error:: 输出具体数值（会在公开的运行页面上显示），
      #     否则只能看到"步骤失败"，不知道卡在哪一步。
      - name: Smoke test deployed site
        run: |
          set -uo pipefail
          SITE="${{ needs.build.outputs.site_url }}"
          SITE="${SITE/http:\/\//https:\/\/}"
          PAGE_URL="${{ steps.deployment.outputs.page_url }}"
          echo "配置站点地址 site_url = ${SITE:-（空）}"
          echo "本次部署地址 page_url = ${PAGE_URL:-（空）}"
          OK=0
          LAST_CODE=""
          LAST_CSS=""
          for BASE in "$SITE" "$PAGE_URL"; do
            [ -z "$BASE" ] && continue
            echo "===== 检查目标：$BASE ====="
            for i in $(seq 1 6); do
              code=$(curl -s -o page.html -w '%{http_code}' -L "$BASE/?smoke=$i" || true)
              LAST_CODE="$code"
              CSS_PATH=$(grep -oE 'href=[^ >]+\.css' page.html | head -1 | sed 's/^href=//' | tr -d '"')
              LAST_CSS="$CSS_PATH"
              cachehdr=$(curl -s -o /dev/null -D - -L "$BASE/?smoke=$i" 2>/dev/null | grep -iE '^(cf-cache-status|age|x-cache):' | tr -d '\r' | paste -sd' ' - || true)
              echo "第 $i 次：首页 HTTP=$code ；样式表=${CSS_PATH:-（未找到）} ；缓存头=${cachehdr:-无}"
              if [ "$code" = "200" ] && [ -n "$CSS_PATH" ]; then
                case "$CSS_PATH" in
                  http*) CSS_URL="$CSS_PATH" ;;
                  *) ORIGIN=$(echo "$BASE" | sed -E 's#(https?://[^/]+).*#\1#'); CSS_URL="$ORIGIN$CSS_PATH" ;;
                esac
                csscode=$(curl -s -o /dev/null -w '%{http_code}' -L "$CSS_URL" || true)
                echo "       样式表 URL=$CSS_URL -> HTTP=$csscode"
                if [ "$csscode" = "200" ]; then
                  OK=1
                  echo "✅ 自检通过（目标 $BASE）"
                  break 2
                fi
              fi
              echo "       内容可能尚未同步，等 15 秒后重试…"
              sleep 15
            done
          done
          if [ "$OK" != "1" ]; then
            SNIPPET=$(tr -d '\n' < page.html 2>/dev/null | head -c 160 || true)
            echo "::error::部署后自检未通过（两个候选地址各重试 6 次）。site_url=${SITE:-空} page_url=${PAGE_URL:-空} 最后首页HTTP=${LAST_CODE:-无} 最后样式表路径=${LAST_CSS:-无} 页面开头=${SNIPPET:-空}"
            exit 1
          fi
