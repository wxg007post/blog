# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://blowfish.page/docs/getting-started/

theme = "blowfish"
baseURL = "https://blog.wxgg.eu.cc/"
defaultContentLanguage = "zh-cn"

# pluralizeListTitles = "true" # hugo function useful for non-english languages, find out more in  https://gohugo.io/getting-started/configuration/#pluralizelisttitles

enableRobotsTXT = true
summaryLength = 70          # 开启 CJK 后约等于 70 个汉字（见方案 3.4.7）

# ---- 本站新增（方案 3.4.6 / 3.4.7）----
timeZone = "Asia/Shanghai"  # 不写的话部分时间按 UTC 走，文章日期会差 8 小时
hasCJKLanguage = true       # 中文按字统计字数与阅读时间；不开会显示「1 词 · 1 分钟阅读」
mainSections = ["posts"]    # 明确「文章区」= content/posts/，避免 about 等页面混进文章流

buildDrafts = false
buildFuture = false

enableEmoji = true

# googleAnalytics = "G-XXXXXXXXX"

[pagination]
  pagerSize = 100

[imaging]
  anchor = 'Center'

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 0
  toLower = false

    [[related.indices]]
        name = "tags"
        weight = 100

    [[related.indices]]
        name = "categories"
        weight = 100

    [[related.indices]]
        name = "series"
        weight = 50

    [[related.indices]]
        name = "authors"
        weight = 20

    [[related.indices]]
        name = "date"
        weight = 10

    [[related.indices]]
      applyFilter = false
      name = 'fragmentrefs'
      type = 'fragments'
      weight = 10

# ---- 本站声明的 Hugo 版本区间（与 Blowfish 主题的要求保持一致，见方案 3.5）----
# 锁定 0.165.0 extended：低于 0.162.0 或高于 0.165.0 都可能构建失败
[module.hugoVersion]
  extended = true
  min = "0.162.0"
  max = "0.165.0"
